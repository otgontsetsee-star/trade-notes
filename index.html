    head.push('<p>Сүүлийн арилжаагаа TP-ийн <b>'+Math.round(tpFrac(last)*100)+'%</b>-д хаасан байна. Дараагийнхыг TP хүртэл тэвчье!</p>');
  else if(last && isCopied(last))
    head.push('<p>Сүүлийн арилжаа бусдын санаагаар орсон байна. Дараагийнх нь <b>өөрийн</b> шинжилгээ байг.</p>');
  var sess = autoSession(srvNow.time, S.serverUtcOffset), lim = num(S.sessionHours)*60;
  var inSess = todayT.filter(function(t){ return (t.session || autoSession(t.time, S.serverUtcOffset)) === sess; });
  if(sess && lim && inSess.length){
    var el = minsOf(srvNow.date, srvNow.time) - Math.min.apply(null, inSess.map(function(t){ return minsOf(t.date, t.time); }));
    if(el > lim) head.splice(soon ? 2 : 1, 0, '<p class="hi">'+esc(sess)+' сесс дээр '+fmtDur(el)+' болж, '+num(S.sessionHours)+' цагийн хязгаар хэтэрлээ. Зогсох цаг!</p>');
    else head.push('<p>'+esc(sess)+' сесс дээр '+fmtDur(el)+' ажиллалаа · '+fmtDur(Math.max(0, lim-el))+' үлдлээ.</p>');
  }
  var tips = botTips();
  return head.slice(0, 2).concat(['<p>'+tips[bot.tip % tips.length]+'</p>']);
}
/* ---- Juni-гийн байрлал: алхах, чирэх ---- */
var botPos = null, botEntered = false, botDrag = null, botWalkT = null, botLastMove = Date.now();
var botReduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function botBox(){ return document.getElementById("bot"); }
function botSize(){ var b = botBox(); return {w: b.offsetWidth || 72, h: b.offsetHeight || 76}; }
function botClamp(p){
  var s = botSize();
  return {x: Math.max(6, Math.min(window.innerWidth - s.w - 6, p.x)), y: Math.max(6, Math.min(window.innerHeight - s.h - 6, p.y))};
}
function botHome(){
  try{
    var o = JSON.parse(localStorage.getItem("xau_bot_pos") || "null");
    if(o && isFinite(o.fx) && isFinite(o.fy)) return botClamp({x: o.fx*window.innerWidth, y: o.fy*window.innerHeight});
  }catch(e){}
  var s = botSize();
  return botClamp({x: window.innerWidth - s.w - 20, y: window.innerHeight - s.h - 16});
}
function botSave(){
  try{ localStorage.setItem("xau_bot_pos", JSON.stringify({fx: botPos.x/window.innerWidth, fy: botPos.y/window.innerHeight})); }catch(e){}
}
function botSide(){
  var b = botBox();
  b.classList.toggle("bl", botPos.x < window.innerWidth/2);
  b.classList.toggle("below", botPos.y < 230);
}
function botPlace(p, secs){
  var b = botBox(), to = botClamp(p);
  clearTimeout(botWalkT);
  if(secs && !botReduce){
    if(botPos) b.classList.toggle("flip", to.x < botPos.x);
    b.style.setProperty("--walk", secs+"s");
    b.classList.add("walking");
    void b.offsetWidth;
    botWalkT = setTimeout(function(){ b.classList.remove("walking"); b.classList.remove("flip"); }, secs*1000 + 60);
  } else {
    b.classList.remove("walking");
  }
  botPos = to;
  b.style.left = to.x+"px"; b.style.top = to.y+"px";
  botSide();
  botLastMove = Date.now();
}
function botWalkTo(p, speed){
  var to = botClamp(p), d = botPos ? Math.hypot(to.x-botPos.x, to.y-botPos.y) : 0;
  botPlace(to, Math.min(8, Math.max(0.6, d/(speed||110))));
}
function botEnter(){
  var b = botBox();
  b.hidden = false;
  var home = botHome();
  if(botReduce){ botPlace(home); botEntered = true; return; }
  b.classList.remove("walking");
  botPos = {x: -80, y: home.y};
  b.style.left = "-80px"; b.style.top = home.y+"px";
  botSide(); void b.offsetWidth;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ botWalkTo(home, 420); }); });
  botEntered = true;
}
function botRoam(){
  var B = botCfg(), b = botBox();
  if(!B.on || !B.roam || botReduce || !botPos || botDrag || document.hidden) return;
  if(b.classList.contains("talk") || b.classList.contains("walking")) return;
  if(Date.now() - botLastMove < 20000 || Math.random() > 0.45) return;
  var s = botSize(), spanX = window.innerWidth - s.w - 12;
  var tx = 6 + Math.random()*spanX;
  if(Math.abs(tx - botPos.x) < 140) tx = botPos.x > window.innerWidth/2 ? botPos.x - 280 : botPos.x + 280;
  botWalkTo({x: tx, y: botPos.y}, 95);
  setTimeout(function(){ if(botPos) botSave(); }, 9000);
}
(function(){
  var btn = document.getElementById("botBtn");
  btn.addEventListener("pointerdown", function(e){
    if(e.button !== undefined && e.button !== 0) return;
    var b = botBox();
    b.classList.remove("walking"); clearTimeout(botWalkT);
    var r = b.getBoundingClientRect();
    botDrag = {sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top, moved: false};
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
  });
  btn.addEventListener("pointermove", function(e){
    if(!botDrag) return;
    var dx = e.clientX - botDrag.sx, dy = e.clientY - botDrag.sy;
    if(!botDrag.moved && Math.hypot(dx, dy) < 6) return;
    botDrag.moved = true; botBox().classList.add("dragging");
    botPlace({x: botDrag.ox + dx, y: botDrag.oy + dy});
  });
  function end(){
    if(!botDrag) return;
    var moved = botDrag.moved; botDrag = null;
    botBox().classList.remove("dragging");
    if(moved) botSave(); else botSay(false);
  }
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", end);
  btn.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); botSay(false); } });
  window.addEventListener("resize", function(){ if(botPos) botPlace(botPos); });
})();
function botSay(run){
  var B = botCfg(), box = botBox();
  if(!box || !B.on) return;
  document.getElementById("botMsg").innerHTML = botLines().join("");
  document.getElementById("botTime").textContent = ubOf(Date.now()).time + " УБ";
  if(!botEntered) botEnter();
  else if(run && !botReduce && !box.classList.contains("walking")){
    box.classList.remove("hop"); void box.offsetWidth; box.classList.add("hop");
    setTimeout(function(){ box.classList.remove("hop"); }, 600);
  }
  box.hidden = false;
  box.classList.add("talk");
  box.classList.toggle("worry", document.getElementById("botMsg").innerHTML.indexOf('class="hi"') >= 0);
  box.classList.add("speaking"); clearTimeout(bot.spkT);
  bot.spkT = setTimeout(function(){ box.classList.remove("speaking"); }, 2800);
  clearTimeout(bot.hideT);
  bot.hideT = setTimeout(function(){ box.classList.remove("talk"); box.classList.remove("worry"); }, 25000);
  bot.last = Date.now(); bot.tip++;
  try{ localStorage.setItem("xau_bot_last", String(bot.last)); localStorage.setItem("xau_bot_tip", String(bot.tip)); }catch(e){}
  if(B.notify && document.hidden && typeof Notification !== "undefined" && Notification.permission === "granted"){
    try{ new Notification("Juni · Trade notes", {body: document.getElementById("botMsg").textContent.slice(0, 220)}); }catch(e){}
  }
}
function botTick(){
  var B = botCfg(), box = botBox();
  if(!B.on){ if(box) box.hidden = true; return; }
  var soon = botSoonEvent(15);
  if(soon && !bot.spoken[soon.code+soon.t_ms]){ bot.spoken[soon.code+soon.t_ms] = 1; botSay(true); return; }
  if(Date.now() - bot.last >= B.every*60000) botSay(true);
}
document.getElementById("botOk").addEventListener("click", function(){ botBox().classList.remove("talk"); botBox().classList.remove("worry"); });
document.getElementById("botMore").addEventListener("click", function(){ botSay(false); });
document.getElementById("view").addEventListener("click", function(e){
  if(e.target.id === "saveBot"){
    var notify = document.getElementById("botNotify").checked;
    state.settings.bot = {on: document.getElementById("botOn").checked, every: num(document.getElementById("botEvery").value) || 60, notify: notify, roam: document.getElementById("botRoam").checked};
    if(notify && typeof Notification !== "undefined" && Notification.permission === "default"){
      try{ Notification.requestPermission(); }catch(err){}
    }
    putSettings();
    var box = document.getElementById("bot");
    if(!state.settings.bot.on){ box.hidden = true; box.classList.remove("talk"); toast("Juni амарч байна"); }
    else { toast("Juni-гийн тохиргоо хадгалагдлаа"); botSay(true); }
    return;
  }
  if(e.target.id === "botTest"){ botSay(true); }
});

/* ================= эхлүүлэх ================= */
setInterval(function(){
  if(state.tab !== "cal") return;
  var el = document.getElementById("neCount"), nx = nextBigEvent();
  if(el && nx) el.innerHTML = countdownHtml(nx);
}, 30000);
try{ var th = localStorage.getItem("xau_theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
try{ if(localStorage.getItem("xau_hide_demo")) state.usingDemo = false; }catch(e){}
loadLocal();
render();
initStore();
setTimeout(function(){ botSay(true); }, 3200);
setInterval(botTick, 30000);
setInterval(botRoam, 12000);
</script>
